# Every repo the site knows about, in one place. Edit this file by hand; the build keeps it
# up to date and never overwrites what you set.
#
# categories: the sections on the page, in page order. These are the only valid values for
#   a repo's "category". A repo goes in the first category whose "topics" (GitHub topics) or
#   "names" (a pattern for the repo name) match it, or in the one with "default: true".
#     title, intro   the section heading and the line under it
#     topics         GitHub topics that put a repo here
#     names          a name pattern, for repos named by convention
#     chip           text shown on every card in the section, in place of the license
#     more           a link under the intro: { label, url }
#     default        where repos that match nothing go; the build warns about each one
#
# repos: one entry per repo, matched by its GitHub id, so a renamed repo keeps your settings.
#   id, repo     GitHub's id and the current Owner/name. The build updates "repo" on a rename.
#   show         yours: true or false, whether it appears at all
#   category     yours: one of the categories above
#   name         yours: the name shown on the card, if the automatic one reads wrong
#   label        yours: a private repo's chip, in place of "Pending release"
#   auto         the build's own guesses, rewritten on every build. Anything you set above
#                wins over it. "gone" is the date a repo left GitHub's public list (deleted,
#                made private or moved); it stays here, hidden, until you delete the entry.
#
# New public repos are added by the daily build. Private repos only appear here once you
# choose to show them: they live in repos.private.yaml on your Mac (git-ignored). See README.

categories:
  mac:
    title: Mac apps
    intro: Small native apps that do one job and ask before they change anything.
    topics: [ macos ]
  ios:
    title: iOS apps
    intro: Apps for iPhone and iPad.
    topics: [ ios, iphone, ipad ]
  minecraft:
    title: Minecraft plugins
    intro: Plugins for Minecraft servers, mostly Paper.
    topics: [ minecraft ]
  science:
    title: Science tools
    intro: "The OneOrigin suite: frameworks for lineage, pedigree and taxonomy data. Source-available under PolyForm Noncommercial 1.0.0."
    names: "^one[a-z]+$"
    chip: Source-available
    more: { label: "@captiveorigins on npm", url: "https://www.npmjs.com/org/captiveorigins" }
  payload:
    title: Payload plugins
    intro: Plugins for the Payload CMS. The published ones are on npm under @captiveorigins.
    topics: [ payload-plugin ]
    more: { label: "@captiveorigins on npm", url: "https://www.npmjs.com/org/captiveorigins" }
  other:
    title: Other
    intro: Everything else that is public.
    default: true

